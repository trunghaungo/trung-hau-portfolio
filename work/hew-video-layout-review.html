  <style>
    #hew-video-review { background:#f3f0e8; color:#171717; font-family:Inter,Arial,sans-serif; padding:clamp(20px,4vw,36px); }
    #hew-video-review * { box-sizing:border-box; }
    #hew-video-review .hv-intro { border-bottom:1px solid #17171730; padding-bottom:24px; margin-bottom:28px; }
    #hew-video-review .hv-kicker { font-size:12px; letter-spacing:.04em; margin:0 0 10px; }
    #hew-video-review h2 { margin:0 0 10px; font-size:clamp(32px,6vw,52px); line-height:1.02; letter-spacing:-.05em; font-weight:500; }
    #hew-video-review .hv-sub { font-size:14px; margin:0; }
    #hew-video-review .hv-heading { display:flex; gap:16px; justify-content:space-between; align-items:baseline; margin:0 0 16px; }
    #hew-video-review h3 { margin:0; font-size:24px; letter-spacing:-.04em; font-weight:500; }
    #hew-video-review .hv-count { font-size:12px; }
    #hew-video-review .hv-shorts { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; }
    #hew-video-review figure { margin:0; min-width:0; }
    #hew-video-review .hv-frame { position:relative; background:#171717; overflow:hidden; aspect-ratio:9/16; }
    #hew-video-review img { display:block; width:100%; height:100%; object-fit:contain; }
    #hew-video-review figcaption { font-size:13px; line-height:1.4; margin-top:9px; }
    #hew-video-review .hv-dot { position:absolute; right:10px; bottom:10px; display:grid; place-items:center; height:30px; width:30px; border-radius:50%; background:#f04b32; color:#171717; }
    #hew-video-review .hv-long { margin-top:40px; padding-top:24px; border-top:1px solid #17171730; }
    #hew-video-review .hv-films { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:20px; align-items:start; }
    #hew-video-review .hv-films .hv-frame { aspect-ratio:16/9; }
    #hew-video-review .hv-feature figcaption { font-size:20px; letter-spacing:-.03em; }
    #hew-video-review .hv-film-meta { display:block; font-size:12px; letter-spacing:0; margin-top:5px; }
    #hew-video-review .hv-secondary { display:grid; gap:18px; }
    #hew-video-review .hv-note { font-size:12px; margin:22px 0 0; }
    @media(max-width:520px) {
      #hew-video-review .hv-shorts { grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px 12px; }
      #hew-video-review .hv-films { grid-template-columns:1fr; }
      #hew-video-review .hv-heading { flex-wrap:wrap; gap:6px; }
    }
